<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strict Practice Arena • Grade 3 Learning Mastery</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #06b6d4;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Lock Header */
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #334155;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-lock {
      background: #dc2626;
      color: white;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
      animation: pulseAlert 2s infinite;
    }

    @keyframes pulseAlert {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .status-center {
      text-align: center;
    }

    .progress-bar-container {
      width: 280px;
      height: 10px;
      background: #334155;
      border-radius: 9999px;
      overflow: hidden;
      margin: 6px auto 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      width: 0%;
      transition: width 0.3s ease;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .metric-pill {
      background: #1e293b;
      border: 1px solid #475569;
      padding: 6px 14px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .practice-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 24px;
      padding: 32px;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      text-align: center;
    }

    .word-emoji {
      font-size: 64px;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    }

    .target-word-title {
      font-size: 2rem;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .collocation-text {
      font-size: 1.15rem;
      color: #cbd5e1;
      margin-bottom: 20px;
      font-weight: 600;
      background: #0f172a;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .speak-btn {
      background: #4f46e5;
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
    }

    .speak-btn:hover {
      background: #4338ca;
      transform: scale(1.15);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
    }

    .option-btn {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 14px 16px;
      color: #f1f5f9;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .option-btn:hover {
      border-color: #38bdf8;
      background: #1e293b;
      transform: translateY(-2px);
    }

    .option-btn.correct {
      background: #064e3b !important;
      border-color: #22c55e !important;
      color: #86efac !important;
    }

    .option-btn.wrong {
      background: #7f1d1d !important;
      border-color: #ef4444 !important;
      color: #fca5a5 !important;
    }

    .explanation-box {
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Warning Overlay */
    .warning-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(153, 27, 27, 0.95);
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .warning-icon {
      font-size: 80px;
      animation: shake 0.5s infinite alternate;
    }

    @keyframes shake {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(8deg); }
    }

    .warning-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fee2e2;
      margin: 16px 0 8px;
    }

    .warning-desc {
      font-size: 1.15rem;
      color: #fca5a5;
      max-width: 500px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-return {
      background: white;
      color: #991b1b;
      border: none;
      padding: 14px 32px;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
    }

    .btn-return:hover {
      transform: scale(1.05);
    }

    /* Finish Modal */
    .finish-card {
      background: #1e293b;
      border: 3px solid #10b981;
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      max-width: 580px;
      box-shadow: 0 25px 60px rgba(16, 185, 129, 0.25);
    }

    .btn-home {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Warning Overlay -->
  <div class="warning-overlay" id="warningOverlay">
    <div class="warning-icon">⚠️</div>
    <div class="warning-title">VIOLATION DETECTED!</div>
    <div class="warning-desc">
      You switched tabs or minimized the practice window!<br>
      This attempt has been <strong>recorded in the teacher's database</strong>.<br>
      <span style="font-weight: 800; color: white;">Violations logged: <span id="violationCountDisplay">1</span></span>
    </div>
    <button class="btn-return" onclick="dismissWarning()">I am back! Return to Practice</button>
  </div>

  <!-- Header -->
  <header>
    <div class="status-left">
      <div class="badge-lock">🔒 STRICT LOCK MODE</div>
      <div style="font-weight:700;">Student: <span id="studentNameSpan" style="color:#38bdf8;">{{ student }}</span></div>
    </div>

    <div class="status-center">
      <div style="font-size:0.85rem; color:var(--text-muted);">
        Mastery Progress: <span id="masteredCount">0</span> / <span id="totalWordCount">0</span> Mastered
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <div class="status-right">
      <div class="metric-pill">⭐ <span id="scoreDisplay">0</span></div>
      <div class="metric-pill" style="color:#ef4444;">⚠️ Swapped: <span id="tabCountHeader">0</span></div>
      <div class="metric-pill">⏱️ <span id="timerDisplay">00:00</span></div>
    </div>
  </header>

  <!-- Main Practice Area -->
  <main id="mainContainer">
    <div class="practice-card" id="cardContainer">
      <div style="font-size:1.2rem; font-weight:700; margin-bottom:20px; color:#38bdf8;">
        Loading Practice Queue...
      </div>
    </div>
  </main>

  <script>
    const studentName = {{ student|tojson }};
    const currentWeek = {{ week|tojson }};
    const currentMode = {{ mode|tojson }};

    let practiceQueue = [];
    let initialCount = 0;
    let masteredCount = 0;
    let score = 0;
    let tabSwitches = 0;
    let secondsElapsed = 0;
    let timerInterval = null;
    let isFinished = false;
    let mistakeList = [];

    // Audio synthesizer
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.25);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.frequency.value = freq;
            const t = now + idx * 0.12;
            g.gain.setValueAtTime(0.2, t);
            g.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
            o.start(t);
            o.stop(t + 0.3);
          });
        }
      } catch (e) {}
    }

    function speakText(txt) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.rate = 0.9;
      u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    }

    // ==================== STRICT LOCK & ANTI-QUIT ENGINE ====================
    function activateStrictLock() {
      // 1. Request fullscreen
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      // 2. Prevent page reload or tab closing
      window.addEventListener('beforeunload', handleBeforeUnload);

      // 3. Prevent back button
      history.pushState(null, null, location.href);
      window.onpopstate = () => history.pushState(null, null, location.href);

      // 4. Detect tab switching or window blur
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden' && !isFinished) {
          registerViolation();
        }
      });
      window.addEventListener('blur', () => {
        if (!isFinished) {
          registerViolation();
        }
      });
    }

    function handleBeforeUnload(e) {
      if (!isFinished) {
        e.preventDefault();
        e.returnValue = 'Strict Mode Active: You cannot quit without finishing your practice session!';
        return e.returnValue;
      }
    }

    function registerViolation() {
      tabSwitches++;
      document.getElementById('tabCountHeader').textContent = tabSwitches;
      document.getElementById('violationCountDisplay').textContent = tabSwitches;
      document.getElementById('warningOverlay').style.display = 'flex';
      playSound('wrong');
    }

    function dismissWarning() {
      document.getElementById('warningOverlay').style.display = 'none';
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    // ==================== TIMER ====================
    function startTimer() {
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
      }, 1000);
    }

    // ==================== PRACTICE ENGINE ====================
    async function loadPracticeQueue() {
      try {
        const resp = await fetch(`/api/vocab_bank?week=${currentWeek}`);
        const words = await resp.json();
        // Shuffle
        practiceQueue = words.sort(() => Math.random() - 0.5);
        initialCount = practiceQueue.length;
        document.getElementById('totalWordCount').textContent = initialCount;
        renderNextItem();
      } catch (e) {
        console.error('Error loading bank:', e);
      }
    }

    let currentItem = null;

    function renderNextItem() {
      if (practiceQueue.length === 0) {
        finishPractice();
        return;
      }

      currentItem = practiceQueue[0];
      const container = document.getElementById('cardContainer');

      // Generate 4 options: 1 correct + 3 distractors
      const pool = currentItem.week ? currentItem : currentItem;
      // create distractors from current item meaning or words
      const options = generateOptions(currentItem);

      container.innerHTML = `
        <div class="word-emoji">${currentItem.emoji || '📖'}</div>
        <div class="target-word-title">
          <span>${currentItem.word.toUpperCase()}</span>
          <button class="speak-btn" onclick="speakText('${currentItem.audio || currentItem.word}')">🔊</button>
        </div>
        <div class="collocation-text">
          "${currentItem.colloc}"
        </div>
        <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:12px;">
          Choose the correct meaning or function:
        </p>
        <div class="options-grid">
          ${options.map((opt, idx) => `
            <button class="option-btn" onclick="handleChoice(this, ${opt.isCorrect})">
              ${opt.text}
            </button>
          `).join('')}
        </div>
        <div class="explanation-box" id="explanationBox"></div>
      `;

      speakText(currentItem.word);
    }

    function generateOptions(target) {
      const correct = { text: target.meaning, isCorrect: true };
      // Distractor pool based on subject
      const genericDistractors = [
        "blocks all light completely",
        "instrument to look at space",
        "8 front teeth used for slicing",
        "largest teeth used for grinding",
        "turn a round knob with numbers",
        "push down with your finger",
        "pull handle down beside screen",
        "twenty baby teeth in children",
        "energy we use to see the world",
        "marks used to count data in fives",
        "all light passes through easily"
      ].filter(d => d.toLowerCase() !== target.meaning.toLowerCase());

      const shuffledDistractors = genericDistractors.sort(() => Math.random() - 0.5).slice(0, 3);
      const opts = [correct, ...shuffledDistractors.map(d => ({ text: d, isCorrect: false }))];
      return opts.sort(() => Math.random() - 0.5);
    }

    async function handleChoice(btn, isCorrect) {
      const parent = btn.parentElement;
      parent.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      const expBox = document.getElementById('explanationBox');

      if (isCorrect) {
        btn.classList.add('correct');
        playSound('correct');
        score += 10;
        masteredCount++;
        document.getElementById('scoreDisplay').textContent = score;
        document.getElementById('masteredCount').textContent = masteredCount;

        const pct = Math.min(100, Math.round((masteredCount / initialCount) * 100));
        document.getElementById('progressBar').style.width = pct + '%';

        expBox.style.background = 'rgba(6, 78, 59, 0.4)';
        expBox.style.color = '#86efac';
        expBox.innerHTML = `✓ Mastered! "${currentItem.word}" &rarr; ${currentItem.meaning}`;

        // Record to DB
        fetch('/api/record_vocab', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            student_name: studentName,
            word: currentItem.word,
            week: currentWeek,
            is_correct: true
          })
        });

        // Remove from queue
        practiceQueue.shift();
      } else {
        btn.classList.add('wrong');
        playSound('wrong');
        expBox.style.background = 'rgba(127, 29, 29, 0.4)';
        expBox.style.color = '#fca5a5';
        expBox.innerHTML = `✗ Needs Review! Correct: "${currentItem.meaning}". It will return later!`;

        mistakeList.push({
          item: currentItem.word,
          user_answer: btn.textContent.trim(),
          correct_answer: currentItem.meaning
        });

        // Record mistake to DB
        fetch('/api/record_vocab', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            student_name: studentName,
            word: currentItem.word,
            week: currentWeek,
            is_correct: false
          })
        });

        // Move to the back of the queue (Leitner repetition!)
        const failedItem = practiceQueue.shift();
        practiceQueue.push(failedItem);
      }

      setTimeout(() => {
        renderNextItem();
      }, 1500);
    }

    async function finishPractice() {
      isFinished = true;
      clearInterval(timerInterval);
      window.removeEventListener('beforeunload', handleBeforeUnload);

      // Submit attempt to server database
      const maxPossible = initialCount * 10;
      await fetch('/api/submit_attempt', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          student_name: studentName,
          week: currentWeek,
          subject: 'Vocabulary Mastery Arena',
          score: score,
          max_score: maxPossible,
          tab_switches: tabSwitches,
          duration_seconds: secondsElapsed,
          status: 'COMPLETED',
          mistakes: mistakeList
        })
      });

      playSound('fanfare');
      const container = document.getElementById('cardContainer');
      container.innerHTML = `
        <div class="finish-card" style="margin:0 auto;">
          <div style="font-size:54px;">🎉🏆🥇</div>
          <h2 style="font-size:2rem; color:#34d399; margin:12px 0 6px;">PRACTICE COMPLETE!</h2>
          <p style="font-size:1.1rem; color:#cbd5e1;">All ${initialCount} vocabulary words have been 100% mastered!</p>
          <div style="background:#0f172a; padding:16px; border-radius:14px; margin:20px 0; text-align:left; font-size:0.95rem;">
            <p><strong>Student:</strong> ${studentName}</p>
            <p><strong>Mastery Score:</strong> ${score} / ${maxPossible} (${Math.round((score/maxPossible)*100)}%)</p>
            <p><strong>Time Taken:</strong> ${Math.floor(secondsElapsed/60)}m ${secondsElapsed%60}s</p>
            <p><strong>Tab Switch Violations:</strong> <span style="color:${tabSwitches > 0 ? '#ef4444' : '#10b981'}; font-weight:700;">${tabSwitches}</span></p>
            <p style="color:#38bdf8; margin-top:8px;">✓ Results successfully recorded in Teacher Database!</p>
          </div>
          <button class="btn-home" onclick="window.location.href='/'">
            <span>Back to Student Portal</span>
            <span>🏠</span>
          </button>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      activateStrictLock();
      startTimer();
      loadPracticeQueue();
    });
  </script>
</body>
</html>
